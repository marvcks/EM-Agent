[project]
name = "cnt2d-open"
version = "0.1.0"
description = "Open-source finite-element replacement for the CNT2D MATLAB/COMSOL workflow"
requires-python = ">=3.11,<3.14"
dependencies = [
  "gmsh==4.15.0",
  "scikit-fem==11.0.0",
  "scipy==1.16.3",
  "numpy==2.3.4",
  "matplotlib==3.10.7",
  "meshio==5.3.5",
]

[project.scripts]
cnt2d = "cnt2d.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cnt2d"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
