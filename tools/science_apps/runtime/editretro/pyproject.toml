[project]
name = "em-agent-editretro-runtime"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==1.12.0+cpu", "numpy==1.23.5", "pandas==2.1.4",
  "rdkit==2023.9.2", "SmilesPE==0.0.3", "textdistance==4.6.0",
  "tensorboard==2.15.1", "Cython==0.29.37", "setuptools==68.2.2",
  "wheel==0.45.1", "cffi==1.17.1", "regex==2024.11.6",
  "sacrebleu==1.4.13", "tqdm==4.67.1", "scipy==1.10.1",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
