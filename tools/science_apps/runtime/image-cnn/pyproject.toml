[project]
name = "em-agent-image-cnn-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["torch==2.10.0", "torchvision==0.25.0", "numpy==2.4.2", "pillow==13.0.0"]
[tool.uv]
package = false
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
