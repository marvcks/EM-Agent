[project]
name = "em-agent-molgen-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "chemprop==2.2.2",
  "ipython==9.10.0",
  "lightning==2.6.1",
  "matplotlib==3.10.7",
  "numpy==2.4.2",
  "pandas==3.0.1",
  "psutil==7.2.2",
  "PyYAML==6.0.3",
  "rdkit==2025.9.5",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
  "seaborn==0.13.2",
  "selfies==2.2.0",
  "tokenizers==0.19.1",
  "torch==2.10.0",
  "tqdm==4.67.3",
  "transformers==4.43.4",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
